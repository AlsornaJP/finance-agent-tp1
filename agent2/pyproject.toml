[project]
name = "planejador-de-metas"
version = "0.1.0"
description = "Agente 2 do Projeto de Bloco: planejador de metas de poupança com prazo"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.10",
    "openai-agents>=0.21.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
